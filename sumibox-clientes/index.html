<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SUMIBOX — Nuestros clientes creen en nosotros</title>
    <script src="vendor/gsap.min.js"></script>
    <script src="src/anim.js"></script>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div data-hf-id="hf-sshj"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="18"
      data-width="1080"
      data-height="1920"
    >
      <div data-hf-id="hf-1rt5" id="stage">
        <!-- Navy backdrop with orange geometry: hook background and extended background of the 4:5 collage -->
        <div data-hf-id="hf-kfuz" id="backdrop" class="layer">
          <div data-hf-id="hf-38ku" class="tri" style="left: 0; top: 0; width: 300px; height: 220px; clip-path: polygon(0 0, 100% 0, 0 100%)"></div>
          <div data-hf-id="hf-cbr7" class="tri" style="right: 0; bottom: 0; width: 300px; height: 220px; clip-path: polygon(100% 0, 100% 100%, 0 100%)"></div>
          <div data-hf-id="hf-er73" class="frame" data-layout-allow-overflow style="left: -90px; top: 140px; width: 290px; height: 180px"></div>
          <div data-hf-id="hf-ct1c" class="frame" data-layout-allow-overflow style="right: -90px; bottom: 140px; width: 290px; height: 180px"></div>
          <div data-hf-id="hf-ftph" class="bar" style="right: 90px; top: 250px; width: 160px"></div>
          <div data-hf-id="hf-7elq" class="bar" style="left: 90px; bottom: 250px; width: 160px"></div>
        </div>

        <!-- Scene 1: the original headline (crops of the collage at 2x) -->
        <div data-hf-id="hf-c9e7" id="hook-accent"></div>
        <div data-hf-id="hf-9ocd" id="hcard">
          <div data-hf-id="hf-kq7c" class="hmask" data-layout-allow-overflow style="left: 30px; top: 30px"><div data-hf-id="hf-j9s1" id="hl1" class="sp hl" data-crop="40,205,355,70" data-scale="2"></div></div>
          <div data-hf-id="hf-2i59" class="hmask" data-layout-allow-overflow style="left: 30px; top: 176px"><div data-hf-id="hf-l13d" id="hl2" class="sp hl" data-crop="40,278,352,72" data-scale="2"></div></div>
          <div data-hf-id="hf-k8lu" class="hmask" data-layout-allow-overflow style="left: 30px; top: 324px"><div data-hf-id="hf-h08c" id="hl3" class="sp hl" data-crop="40,352,356,66" data-scale="2"></div></div>
          <div data-hf-id="hf-hhbt" class="hmask" data-layout-allow-overflow style="left: 30px; top: 460px"><div data-hf-id="hf-5in4" id="hl4" class="sp hl" data-crop="40,420,400,74" data-scale="2"></div></div>
          <div data-hf-id="hf-2zkp" id="h-rule" class="sp" data-crop="45,505,125,18" data-scale="2" style="position: absolute; left: 40px; top: 630px"></div>
        </div>

        <!-- Scenes 1–4: the approved collage, moved by the camera -->
        <div data-hf-id="hf-twm1" id="window" class="layer">
          <div data-hf-id="hf-k6zw" id="world" data-layout-allow-overflow>
            <img data-hf-id="hf-3679"
              id="collage"
              class="clip"
              src="assets/sumibox-clientes-collage.png"
              alt="Collage SUMIBOX: Nuestros clientes creen en nosotros"
              data-start="0"
              data-duration="18"
              data-track-index="0"
              data-layout-allow-overflow
            />
            <div data-hf-id="hf-g15n" id="u-trust" class="uline" style="left: 50px; top: 678px; width: 365px"></div>
            <div data-hf-id="hf-hu0q" id="u-elec" class="uline" style="left: 850px; top: 866px; width: 235px; transform: rotate(-9deg)"></div>
            <div data-hf-id="hf-wki9" id="r-ofic" class="cat-ring" style="left: 100px; top: 745px"></div>
            <div data-hf-id="hf-1cut" id="r-limp" class="cat-ring" style="left: 100px; top: 850px"></div>
            <div data-hf-id="hf-8z4a" id="r-dese" class="cat-ring" style="left: 100px; top: 955px"></div>
            <div data-hf-id="hf-y9ed" id="spot"></div>
          </div>
        </div>

        <!-- Scene 5: identity, using the original logo file -->
        <div data-hf-id="hf-ec89" id="ident" class="layer">
          <div data-hf-id="hf-mkh5" id="id-ring"></div>
          <img data-hf-id="hf-bwax" id="logo-full" src="assets/sumibox-logo-original.png" alt="Logo SUMIBOX" />
          <div data-hf-id="hf-09z4" class="id-line" style="left: 150px; top: 1215px; transform-origin: 100% 50%"></div>
          <div data-hf-id="hf-c960" class="id-line" style="left: 710px; top: 1215px; transform-origin: 0 50%"></div>
        </div>

        <!-- Scene 6: end card -->
        <div data-hf-id="hf-o0wz" id="end" class="layer" data-layout-allow-overflow>
          <div data-hf-id="hf-1o3f" class="tri geo-end" style="left: 0; top: 0; width: 330px; height: 250px; clip-path: polygon(0 0, 100% 0, 0 100%)"></div>
          <div data-hf-id="hf-gf8a" class="tri geo-end" style="right: 0; bottom: 0; width: 330px; height: 250px; clip-path: polygon(100% 0, 100% 100%, 0 100%)"></div>
          <div data-hf-id="hf-qpp2" class="frame geo-end" data-layout-allow-overflow style="left: -90px; top: 150px; width: 300px; height: 190px"></div>
          <div data-hf-id="hf-soop" class="frame geo-end" data-layout-allow-overflow style="right: -90px; bottom: 150px; width: 300px; height: 190px"></div>
          <div data-hf-id="hf-kznm" class="bar geo-end" style="right: 90px; top: 250px; width: 160px"></div>
          <div data-hf-id="hf-aai9" class="bar geo-end" style="left: 90px; top: 1660px; width: 160px"></div>
          <div data-hf-id="hf-n9gp" id="end-col">
            <div data-hf-id="hf-4c8w" id="logo-card" class="sp" data-img="logo" data-crop="450,250,632,505" data-scale="0.42"></div>
            <div data-hf-id="hf-ejwk" class="mask" data-layout-allow-overflow style="margin-top: 34px"><div data-hf-id="hf-qzx1" class="e-line">¿TU EMPRESA NECESITA</div></div>
            <div data-hf-id="hf-haq9" class="mask" data-layout-allow-overflow><div data-hf-id="hf-z8mt" class="e-line">SUMINISTROS?</div></div>
            <div data-hf-id="hf-hck2" id="cta-wrap">
              <div data-hf-id="hf-eftt" id="burst"></div>
              <div data-hf-id="hf-sesg" class="cta-line">¡COTIZA HOY</div>
              <div data-hf-id="hf-8s0r" class="cta-line">POR WHATSAPP!</div>
            </div>
            <div data-hf-id="hf-l4fm" id="wa-wrap">
              <div data-hf-id="hf-qkf7" class="pulse"></div>
              <div data-hf-id="hf-6l0h" id="wa">
                <div data-hf-id="hf-ds3u" id="wa-shine" data-layout-allow-overflow></div>
                <svg data-hf-id="hf-nlni" viewBox="0 0 32 32" aria-hidden="true">
                  <path data-hf-id="hf-izpv" d="M16 3C8.8 3 3 8.6 3 15.6c0 2.5.7 4.8 2 6.8L3.6 29l6.8-1.3c1.8.9 3.8 1.4 5.6 1.4 7.2 0 13-5.6 13-12.6S23.2 3 16 3z" fill="none" stroke="#0f2140" stroke-width="2.4" stroke-linejoin="round" />
                  <path data-hf-id="hf-2h68" d="M11.6 9.6c.4-.1.8 0 1 .4l1.3 3c.2.4.1.8-.2 1.1l-.9.9c.8 1.7 2.2 3.1 3.9 3.9l.9-.9c.3-.3.7-.4 1.1-.2l3 1.3c.4.2.5.6.4 1l-.4 1.6c-.1.5-.6.8-1.1.8-5.6-.3-10.1-4.8-10.4-10.4 0-.5.3-1 .8-1.1z" fill="#0f2140" />
                </svg>
                <div data-hf-id="hf-dqw4" class="wa-text">
                  <span data-hf-id="hf-v8y5" class="wa-small">WhatsApp</span>
                  <span data-hf-id="hf-hz7j" class="wa-num">+1 (809) 765-0530</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div data-hf-id="hf-t27g" id="sep" data-layout-allow-overflow></div>
      </div>

      <audio data-hf-id="hf-bwrv"
        id="voz"
        src="assets/sumibox-clientes-voz.wav"
        data-start="0"
        data-duration="18"
        data-track-index="1"
      ></audio>
      <!--
        MÚSICA (pendiente): no hay ninguna pista en el proyecto. Cuando tengas una pista
        instrumental con licencia, cópiala en assets/ y añade aquí un <audio> como este,
        con el nombre real del archivo; data-volume la deja por debajo de la voz:
          <audio id="musica" src="assets/NOMBRE-DE-TU-PISTA.mp3" data-start="0"
                 data-duration="18" data-volume="0.2" data-fade-out="1" data-track-index="2"></audio>
      -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = SUMIBOX_CLIENTES.build();
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
