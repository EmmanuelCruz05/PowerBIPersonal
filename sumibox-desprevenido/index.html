<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>SUMIBOX — Que no te agarre desprevenido</title>
    <script src="vendor/gsap.min.js"></script>
    <script src="src/anim.js"></script>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div data-hf-id="hf-sshj"
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="18"
      data-width="1080"
      data-height="1920"
    >
      <div data-hf-id="hf-1rt5" id="stage">
        <!-- Navy backdrop with orange geometry: hook background and extended background of the 4:5 ad -->
        <div data-hf-id="hf-kfuz" id="backdrop" class="layer">
          <div data-hf-id="hf-38ku" class="tri" style="left: 0; top: 0; width: 300px; height: 220px; clip-path: polygon(0 0, 100% 0, 0 100%)"></div>
          <div data-hf-id="hf-cbr7" class="tri" style="right: 0; bottom: 0; width: 300px; height: 220px; clip-path: polygon(100% 0, 100% 100%, 0 100%)"></div>
          <div data-hf-id="hf-er73" class="frame" data-layout-allow-overflow style="left: -90px; top: 140px; width: 290px; height: 180px"></div>
          <div data-hf-id="hf-ct1c" class="frame" data-layout-allow-overflow style="right: -90px; bottom: 140px; width: 290px; height: 180px"></div>
          <div data-hf-id="hf-ftph" class="bar" style="right: 90px; top: 250px; width: 160px"></div>
          <div data-hf-id="hf-7elq" class="bar" style="left: 90px; bottom: 250px; width: 160px"></div>
        </div>

        <!-- Scene 1: hook -->
        <div data-hf-id="hf-a60g" id="hook">
          <div data-hf-id="hf-haq9" class="mask" data-layout-allow-overflow><div data-hf-id="hf-kevp" id="hk1" class="hk big">¿OTRA VEZ</div></div>
          <div data-hf-id="hf-92bp" class="mask" data-layout-allow-overflow><div data-hf-id="hf-vpq8" id="hk2" class="hk big orange">SE ACABARON…?</div></div>
          <div data-hf-id="hf-ithc" id="hook-bar"></div>
          <div data-hf-id="hf-a98s" class="mask" data-layout-allow-overflow><div data-hf-id="hf-x8ek" id="hk3" class="hk small">LOS SUMINISTROS</div></div>
          <div data-hf-id="hf-9uxr" class="mask" data-layout-allow-overflow><div data-hf-id="hf-3rvt" id="hk4" class="hk small">DE LA OFICINA?</div></div>
        </div>

        <!-- Scenes 2–5: the approved ad, moved by the camera -->
        <div data-hf-id="hf-twm1" id="window" class="layer">
          <div data-hf-id="hf-k6zw" id="world" data-layout-allow-overflow>
            <img data-hf-id="hf-1yzm"
              id="ad"
              class="clip"
              src="assets/sumibox-desprevenido-original.jpg"
              alt="Publicación SUMIBOX: ¿Otra vez se acabaron los suministros de la oficina?"
              data-start="0"
              data-duration="18"
              data-track-index="0"
              data-layout-allow-overflow
            />
            <div data-hf-id="hf-vabh" id="hb1" class="hl-box" style="left: 58px; top: 526px; width: 458px; height: 128px"></div>
            <div data-hf-id="hf-eek2" id="hb2" class="hl-box" style="left: 58px; top: 651px; width: 458px; height: 130px"></div>
            <div data-hf-id="hf-4ybm" id="hb3" class="hl-box" style="left: 58px; top: 779px; width: 458px; height: 127px"></div>
            <div data-hf-id="hf-yh83" id="cat-bar"></div>
            <div data-hf-id="hf-xcvj" id="block-line"></div>
            <div data-hf-id="hf-q2cj" id="accent-glow"></div>
            <div data-hf-id="hf-yv5v" id="logo-focus"></div>
            <div data-hf-id="hf-or99" id="logo-flash"></div>
            <svg data-hf-id="hf-fdll" id="logo-trace" viewBox="0 0 1179 1465" aria-hidden="true">
              <rect data-hf-id="hf-q5fd" x="143" y="12" width="330" height="175" rx="10" pathLength="1000" />
            </svg>
          </div>
        </div>

        <!-- Scene 6: end card -->
        <div data-hf-id="hf-o0wz" id="end" class="layer" data-layout-allow-overflow>
          <div data-hf-id="hf-1o3f" class="tri geo-end" style="left: 0; top: 0; width: 330px; height: 250px; clip-path: polygon(0 0, 100% 0, 0 100%)"></div>
          <div data-hf-id="hf-gf8a" class="tri geo-end" style="right: 0; bottom: 0; width: 330px; height: 250px; clip-path: polygon(100% 0, 100% 100%, 0 100%)"></div>
          <div data-hf-id="hf-qpp2" class="frame geo-end" data-layout-allow-overflow style="left: -90px; top: 150px; width: 300px; height: 190px"></div>
          <div data-hf-id="hf-soop" class="frame geo-end" data-layout-allow-overflow style="right: -90px; bottom: 150px; width: 300px; height: 190px"></div>
          <div data-hf-id="hf-kznm" class="bar geo-end" style="right: 90px; top: 250px; width: 160px"></div>
          <div data-hf-id="hf-aai9" class="bar geo-end" style="left: 90px; top: 1660px; width: 160px"></div>
          <div data-hf-id="hf-n9gp" id="end-col">
            <div data-hf-id="hf-b1uu" class="mask" data-layout-allow-overflow><div data-hf-id="hf-j4zn" class="e-line">NO ESPERES A</div></div>
            <div data-hf-id="hf-anjt" class="mask" data-layout-allow-overflow><div data-hf-id="hf-uonc" class="e-line">QUE TE FALTEN.</div></div>
            <div data-hf-id="hf-hck2" id="cta-wrap"><div data-hf-id="hf-eftt" id="burst"></div><div data-hf-id="hf-749k" id="cta-hoy">¡COTIZA HOY!</div></div>
            <div data-hf-id="hf-9j0f" id="logo-card" class="sp" data-crop="143,12,330,175" data-scale="0.95"></div>
            <div data-hf-id="hf-xys6" id="srl">SUMIBOX SRL</div>
            <div data-hf-id="hf-6l0h" id="wa">
              <div data-hf-id="hf-ds3u" id="wa-shine" data-layout-allow-overflow></div>
              <svg data-hf-id="hf-nlni" viewBox="0 0 32 32" aria-hidden="true">
                <path data-hf-id="hf-izpv" d="M16 3C8.8 3 3 8.6 3 15.6c0 2.5.7 4.8 2 6.8L3.6 29l6.8-1.3c1.8.9 3.8 1.4 5.6 1.4 7.2 0 13-5.6 13-12.6S23.2 3 16 3z" fill="none" stroke="#0f2140" stroke-width="2.4" stroke-linejoin="round" />
                <path data-hf-id="hf-2h68" d="M11.6 9.6c.4-.1.8 0 1 .4l1.3 3c.2.4.1.8-.2 1.1l-.9.9c.8 1.7 2.2 3.1 3.9 3.9l.9-.9c.3-.3.7-.4 1.1-.2l3 1.3c.4.2.5.6.4 1l-.4 1.6c-.1.5-.6.8-1.1.8-5.6-.3-10.1-4.8-10.4-10.4 0-.5.3-1 .8-1.1z" fill="#0f2140" />
              </svg>
              <div data-hf-id="hf-dqw4" class="wa-text">
                <span data-hf-id="hf-p5os" class="wa-small">Escríbenos ahora · WhatsApp</span>
                <span data-hf-id="hf-hz7j" class="wa-num">+1 (809) 765-0530</span>
              </div>
            </div>
          </div>
        </div>

        <div data-hf-id="hf-t27g" id="sep" data-layout-allow-overflow></div>
      </div>

      <audio data-hf-id="hf-q7j6"
        id="voz"
        src="assets/sumibox-desprevenido-voz.wav"
        data-start="0"
        data-duration="18"
        data-track-index="1"
      ></audio>
      <!--
        MÚSICA (pendiente): no hay ninguna pista en el proyecto. Cuando tengas una pista
        instrumental con licencia, cópiala en assets/ y añade aquí un <audio> como este,
        con el nombre real del archivo. data-volume la deja por debajo de la voz:
          <audio id="musica" src="assets/NOMBRE-DE-TU-PISTA.mp3" data-start="0"
                 data-duration="18" data-volume="0.2" data-fade-out="1" data-track-index="2"></audio>
        Los cortes caen en una rejilla de 120 BPM donde la voz lo permite.
      -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = SUMIBOX_DESPREVENIDO.build();
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
